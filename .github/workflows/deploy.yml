name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web manifest
        run: python3 -c "import json; json.load(open('manifest.webmanifest')); print('manifest OK')"

      - name: Run price engine tests
        run: python3 tests/price_test.py

      - name: Verify icons exist
        run: |
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-512.png
          echo "icons OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
